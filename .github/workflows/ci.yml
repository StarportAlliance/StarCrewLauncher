# 与本地 check.bat 同构：排版 -> 风格 -> 构建（警告即错误）-> 测试 + 覆盖率
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 上传覆盖率到 GitHub Code Quality 需要 code-quality: write；
# 上传测试产物需要 actions: write；其余按最小权限只读。
permissions:
  contents: read
  actions: write
  code-quality: write

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原本地工具
        run: dotnet tool restore

      - name: 排版检查（CSharpier）
        run: dotnet csharpier check .

      - name: 风格检查（dotnet format）
        run: dotnet format style StarCrew.Launcher.slnx --verify-no-changes --no-restore

      # 注意：dotnet tool restore 只还原工具清单，不还原 NuGet 包。
      # 全新检出没有 obj/ 产物，后面所有 --no-restore 都依赖这一步先还原。
      - name: 还原 NuGet 包
        run: dotnet restore StarCrew.Launcher.slnx

      - name: 构建（警告即错误）
        run: dotnet build StarCrew.Launcher.slnx -c Release --nologo --no-restore -p:TreatWarningsAsErrors=true

      - name: 全套测试 + 覆盖率
        run: dotnet test StarCrew.Launcher.slnx -c Release --nologo --no-build --settings coverlet.runsettings --collect "XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=test.trx"

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      # coverlet 把报告写在随机 GUID 子目录里，先归档到固定路径再上传，
      # 否则上传 action 拿不到稳定地址。GitHub 侧用这份数据做合并门禁，
      # 见 AGENTS.md 的 Restrict code coverage 说明。
      - name: 整理覆盖率报告路径
        if: always()
        run: |
          $src = Get-ChildItem -Recurse TestResults -Filter *.cobertura.xml | Select-Object -First 1
          Copy-Item $src.FullName TestResults/coverage.cobertura.xml

      - name: 上传覆盖率到 GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: TestResults/coverage.cobertura.xml
          language: C#
          label: code-coverage/dotnet-test

      - name: 依赖漏洞复核
        run: dotnet list StarCrew.Launcher.slnx package --vulnerable --include-transitive
