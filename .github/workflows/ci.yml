# 与本地 check.bat 同构：还原 -> 排版 -> 风格 -> 构建（警告即错误）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原本地工具
        run: dotnet tool restore

      # 注意：dotnet tool restore 只还原工具清单，不还原 NuGet 包。
      # 全新检出没有 obj/ 产物，后面所有 --no-restore 都依赖这一步先还原。
      # 必须排在 dotnet format 之前：没有引用时 Frame.Navigated += 处理器 绑不出委托，
      # IDE0060 会把事件处理器的 sender 误报成未用参数（本地 check.bat 正是先还原再查风格）。
      - name: 还原 NuGet 包
        run: dotnet restore StarCrew.Launcher.slnx

      - name: 排版检查（CSharpier）
        run: dotnet csharpier check .

      - name: 风格检查（dotnet format）
        run: dotnet format style StarCrew.Launcher.slnx --verify-no-changes --no-restore

      - name: 构建（警告即错误）
        run: dotnet build StarCrew.Launcher.slnx -c Release --nologo --no-restore -p:TreatWarningsAsErrors=true

      - name: 依赖漏洞复核
        run: dotnet list StarCrew.Launcher.slnx package --vulnerable --include-transitive
