# CodeQL 代码扫描：补“Require code scanning results”规则的前置条件。
# C# 是 CodeQL 官方支持语言；WinUI 工程必须跑在 windows-latest 上，且用手动 build
# 代替 autobuild（autobuild 猜不准多目标/多架构的解法）。
# 每周跑一次即可（push/PR 由 CI 本身覆盖），省 runner 时间。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: 构建（供扫描分析）
        run: dotnet build StarCrew.Launcher.slnx -c Release --nologo

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
